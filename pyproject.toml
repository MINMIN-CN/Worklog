[project]
name = "worklog"
version = "0.5.2"
description = "本地优先的 AI 工作记录与日报助手（个人版）"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7.0",
    "mss>=9.0.1",
    "Pillow>=10.3.0",
    "psutil>=5.9.8",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/MINMIN-CN/Worklog"
Repository = "https://github.com/MINMIN-CN/Worklog"
Releases = "https://github.com/MINMIN-CN/Worklog/releases"
Issues = "https://github.com/MINMIN-CN/Worklog/issues"
Changelog = "https://github.com/MINMIN-CN/Worklog/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
