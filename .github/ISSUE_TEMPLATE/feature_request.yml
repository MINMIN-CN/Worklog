name: 💡 功能建议 / Feature request
description: 提出新功能或改进建议 / Suggest an idea for this project
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚使用场景，而不只是解决方案。
        Thanks for your idea! Please describe the use case, not just the solution.
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / Problem
      description: 这个功能想解决什么问题？现在你是怎么做替代的？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望「工作小记」怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他替代方案 / Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: willing
    attributes:
      label: 是否愿意提交 PR / Willing to submit a PR?
      options:
        - 愿意 / Yes
        - 需要一些指导 / Yes, with guidance
        - 暂不 / Not now
    validations:
      required: false
